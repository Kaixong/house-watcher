name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: probe
        run: |
          pip install -q playwright requests && python -m playwright install --with-deps chromium >/dev/null 2>&1
          python probe.py > probe.txt 2>&1 || true
          git config user.name bot; git config user.email actions@users.noreply.github.com
          git add probe.txt; git commit -qm "probe mobile"; git push
