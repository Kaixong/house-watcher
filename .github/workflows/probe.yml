name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: probe
        run: |
          D="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          M="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          {
          for id in 20897320 20945964 20873743 25161692; do
            u="https://sale.591.com.tw/home/house/detail/2/$id.html"
            for mode in desk desk_ref mobile; do
              case $mode in
                desk) r=$(curl -sL -A "$D" -w "\n%{url_effective} %{http_code}" "$u");;
                desk_ref) r=$(curl -sL -A "$D" -e "https://kaixong.github.io/house-watcher/" -w "\n%{url_effective} %{http_code}" "$u");;
                mobile) r=$(curl -sL -A "$M" -w "\n%{url_effective} %{http_code}" "$u");;
              esac
              echo "$id $mode | $(echo "$r" | grep -o '<title>[^<]*' | head -1 | cut -c8-70) | $(echo "$r" | tail -1)"
            done
          done
          } > probe.txt 2>&1
          git config user.name bot; git config user.email actions@users.noreply.github.com
          git add probe.txt; git commit -qm "probe links"; git push
